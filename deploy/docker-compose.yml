# AI Telephone Receptionist — Docker Compose for Hostinger VPS
#
# Services:
#   api       — FastAPI voice agent (Python) on port 8000
#   dashboard — Next.js admin dashboard on port 3000
#   nginx     — Reverse proxy with WebSocket support + SSL termination
#
# Domains:
#   api.your-domain.com  → api service
#   app.your-domain.com  → dashboard service

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    networks:
      - pod6

  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: "https://api.your-domain.com"
      NODE_ENV: production
    expose:
      - "3000"
    networks:
      - pod6

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - api
      - dashboard
    networks:
      - pod6

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Run manually for cert issuance/renewal:
    # docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d api.your-domain.com -d app.your-domain.com

networks:
  pod6:
    driver: bridge
